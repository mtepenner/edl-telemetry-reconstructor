apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-config
  namespace: default
data:
  postgresql.conf: |
    max_connections = 100
    shared_buffers = 256MB
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: default
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg15
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "telemetry"
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: default
spec:
  selector:
    app: timescaledb
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  type: ClusterIP
