apiVersion: v1
kind: ConfigMap
metadata:
  name: fusion-engine-config
  namespace: default
data:
  kafka-broker: "kafka:9092"
  kafka-topic: "telemetry"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion-engine
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fusion-engine
  template:
    metadata:
      labels:
        app: fusion-engine
    spec:
      containers:
      - name: fusion-engine
        image: edl-telemetry/fusion-engine:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: fusion-engine-config
              key: kafka-broker
        - name: KAFKA_TOPIC
          valueFrom:
            configMapKeyRef:
              name: fusion-engine-config
              key: kafka-topic
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fusion-engine
  namespace: default
spec:
  selector:
    app: fusion-engine
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
