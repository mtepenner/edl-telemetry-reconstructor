apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edl-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: "edl.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mission-ui
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: fusion-engine
            port:
              number: 8080
